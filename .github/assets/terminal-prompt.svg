<svg xmlns="http://www.w3.org/2000/svg" width="440" height="28" viewBox="0 0 440 28">
  <style>
    .text { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #cdd6f4; }
