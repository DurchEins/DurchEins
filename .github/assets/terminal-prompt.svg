<svg xmlns="http://www.w3.org/2000/svg" width="540" height="34" viewBox="0 0 540 34">
  <style>
    .base { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .prompt { fill: #cba6f7; }
    .line { fill: #cdd6f4; opacity: 0; }
    .l1 { animation: show1 20s infinite; }
    .l2 { animation: show2 20s infinite; }
    .l3 { animation: show3 20s infinite; }
    .l4 { animation: show4 20s infinite; }
    .l5 { animation: show5 20s infinite; }
    @keyframes show1 { 0%, 18% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 19% { opacity: 0; } 20%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 39% { opacity: 0; } 40%, 58% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes show4 { 0%, 59% { opacity: 0; } 60%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes show5 { 0%, 79% { opacity: 0; } 80%, 98% { opacity: 1; } 100% { opacity: 0; } }
    .cursor { fill: #89b4fa; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
  <rect x="1" y="1" width="538" height="32" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="16" y="21" class="base prompt">$ ~/</text>
  <text x="58" y="21" class="base line l1">It's all okay.</text>
  <text x="58" y="21" class="base line l2">Family First ❤️ | Code Second 💻</text>
  <text x="58" y="21" class="base line l3">Learning every day &amp; building step by step.</text>
  <text x="58" y="21" class="base line l4">Smart Home Tinkerer &amp; Material 3 Fan.</text>
  <text x="58" y="21" class="base line l5">n² - Since 2021 ❤️🔥</text>
  <rect x="516" y="10" width="7" height="14" rx="1" class="cursor"/>
</svg>
