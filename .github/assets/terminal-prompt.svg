<svg xmlns="http://www.w3.org/2000/svg" width="560" height="34" viewBox="0 0 560 34">
  <style>
    .base { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .prompt { fill: #cba6f7; }
    .line { fill: #cdd6f4; opacity: 0; }
    .l1 { animation: show1 16s infinite; }
    .l2 { animation: show2 16s infinite; }
    .l3 { animation: show3 16s infinite; }
    .l4 { animation: show4 16s infinite; }
    @keyframes show1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 24% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 49% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes show4 { 0%, 74% { opacity: 0; } 75%, 98% { opacity: 1; } 100% { opacity: 0; } }
    .cursor { fill: #89b4fa; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
  <rect width="560" height="34" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="16" y="21" class="base prompt">$ DurchEins ~</text>
  <text x="128" y="21" class="base line l1">It's all okay.</text>
  <text x="128" y="21" class="base line l2">Family First ❤️ | Code Second 💻</text>
  <text x="128" y="21" class="base line l3">Learning every day &amp; building step by step.</text>
  <text x="128" y="21" class="base line l4">Smart Home Tinkerer &amp; Material 3 Fan.</text>
  <rect x="536" y="10" width="7" height="14" rx="1" class="cursor"/>
</svg>
