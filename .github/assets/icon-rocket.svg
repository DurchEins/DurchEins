<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
  <style>
    .rk { animation: float 2.2s infinite ease-in-out; }
    .fl { animation: fl 0.4s infinite alternate; transform-origin: 7px 17px; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(1px, -1.5px); } }
    @keyframes fl { from { opacity: 0.5; transform: scale(0.85); } to { opacity: 1; transform: scale(1.1); } }
  </style>
  <g class="rk">
    <path fill="#89b4fa" d="M12 2c4 0 8 4 8 8-3 3-6 5-10 6l-2-2c1-4 3-7 6-12z"/>
    <circle cx="14.5" cy="9.5" r="1.5" fill="#181825"/>
    <path class="fl" fill="#f5c2e7" d="M7 15l-3 5 5-3z"/>
  </g>
</svg>
