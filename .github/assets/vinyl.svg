<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
  <style>
    .spin { transform-origin: center; animation: spin 4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <g class="spin">
    <circle cx="12" cy="12" r="10" fill="#181825" stroke="#cba6f7" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="7" fill="none" stroke="#45475a" stroke-width="0.7"/>
    <circle cx="12" cy="12" r="4.5" fill="none" stroke="#45475a" stroke-width="0.7"/>
    <circle cx="12" cy="12" r="3" fill="#cba6f7"/>
    <circle cx="12" cy="12" r="1" fill="#181825"/>
  </g>
</svg>
