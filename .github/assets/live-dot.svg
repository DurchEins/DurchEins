<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
  <style>
    .pulse { animation: pulse 2s infinite ease-in-out; transform-origin: center; }
    @keyframes pulse { 0%, 100% { r: 3; opacity: 0.9; } 50% { r: 6; opacity: 0.2; } }
  </style>
  <circle class="pulse" cx="7" cy="7" r="4" fill="#a6e3a1"/>
  <circle cx="7" cy="7" r="3.5" fill="#a6e3a1"/>
</svg>
