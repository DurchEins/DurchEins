<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="25%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#f5c2e7"/>
      <stop offset="75%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="170" rx="12" fill="url(#bg)" stroke="#313244" stroke-width="1"/>
  <!-- Twinkling Constellation Stars -->
  <circle cx="90" cy="40" r="1.5" fill="#cba6f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="120" r="1.2" fill="#89b4fa"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="35" r="1.8" fill="#f5c2e7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="45" r="1.4" fill="#89b4fa"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="130" r="1.6" fill="#cba6f7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="810" cy="55" r="1.2" fill="#f5c2e7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="140" cy="80" r="1" fill="#cdd6f4" opacity="0.4"/>
  <circle cx="710" cy="85" r="1" fill="#cdd6f4" opacity="0.4"/>
  <line x1="90" y1="40" x2="140" y2="80" stroke="#cba6f7" stroke-width="0.5" opacity="0.2"/>
  <line x1="140" y1="80" x2="180" y2="120" stroke="#89b4fa" stroke-width="0.5" opacity="0.2"/>
  <line x1="640" y1="45" x2="710" y2="85" stroke="#89b4fa" stroke-width="0.5" opacity="0.2"/>
  <line x1="710" y1="85" x2="740" y2="130" stroke="#cba6f7" stroke-width="0.5" opacity="0.2"/>
  <!-- Animated Gradient Title -->
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="url(#textGrad)">DurchEins</text>
</svg>
