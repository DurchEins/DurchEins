<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" fill="none">
  <style>
    .s1 { animation: twinkle 2.4s infinite ease-in-out; }
    .s2 { animation: twinkle 3.3s infinite ease-in-out 0.6s; }
    .s3 { animation: twinkle 2.8s infinite ease-in-out 1.2s; }
    .s4 { animation: twinkle 3.8s infinite ease-in-out 1.8s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .grad-text {
      animation: hue 8s infinite alternate ease-in-out;
    }
    @keyframes hue {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="169" rx="12" fill="url(#bg)" stroke="#313244" stroke-width="1"/>

  <!-- LEFT: SCORPIUS (Skorpion) -->
  <g stroke="#cba6f7" stroke-width="0.7" opacity="0.35">
    <line x1="62" y1="38" x2="94" y2="66"/>
    <line x1="50" y1="64" x2="94" y2="66"/>
    <line x1="66" y1="92" x2="94" y2="66"/>
    <line x1="94" y1="66" x2="122" y2="78"/>
    <line x1="122" y1="78" x2="148" y2="98"/>
    <line x1="148" y1="98" x2="168" y2="124"/>
    <line x1="168" y1="124" x2="196" y2="138"/>
    <line x1="196" y1="138" x2="224" y2="130"/>
    <line x1="224" y1="130" x2="232" y2="110"/>
    <line x1="232" y1="110" x2="216" y2="96"/>
  </g>
  <circle class="s1" cx="62" cy="38" r="1.7" fill="#cba6f7"/>
  <circle class="s2" cx="50" cy="64" r="1.6" fill="#cdd6f4"/>
  <circle class="s3" cx="66" cy="92" r="1.7" fill="#89b4fa"/>
  <circle class="s4" cx="94" cy="66" r="1.9" fill="#cdd6f4"/>
  <circle class="s1" cx="122" cy="78" r="2.7" fill="#f38ba8"/><!-- Antares -->
  <circle class="s2" cx="148" cy="98" r="1.6" fill="#cba6f7"/>
  <circle class="s3" cx="168" cy="124" r="1.6" fill="#cdd6f4"/>
  <circle class="s4" cx="196" cy="138" r="1.7" fill="#89b4fa"/>
  <circle class="s1" cx="224" cy="130" r="1.6" fill="#cba6f7"/>
  <circle class="s2" cx="232" cy="110" r="1.8" fill="#f5c2e7"/>
  <circle class="s3" cx="216" cy="96" r="2.0" fill="#89b4fa"/>

  <!-- RIGHT: URSA MINOR (Kleiner Wagen) -->
  <g stroke="#89b4fa" stroke-width="0.7" opacity="0.35">
    <line x1="665" y1="42" x2="705" y2="58"/>
    <line x1="705" y1="58" x2="745" y2="72"/>
    <line x1="745" y1="72" x2="778" y2="84"/>
    <line x1="778" y1="84" x2="834" y2="74"/>
    <line x1="834" y1="74" x2="848" y2="118"/>
    <line x1="848" y1="118" x2="790" y2="128"/>
    <line x1="790" y1="128" x2="778" y2="84"/>
  </g>
  <circle class="s1" cx="665" cy="42" r="2.6" fill="#89b4fa"/><!-- Polaris -->
  <circle class="s3" cx="705" cy="58" r="1.6" fill="#cdd6f4"/>
  <circle class="s2" cx="745" cy="72" r="1.6" fill="#cba6f7"/>
  <circle class="s4" cx="778" cy="84" r="1.8" fill="#cdd6f4"/>
  <circle class="s1" cx="834" cy="74" r="2.1" fill="#f5c2e7"/>
  <circle class="s3" cx="848" cy="118" r="2.0" fill="#89b4fa"/>
  <circle class="s2" cx="790" cy="128" r="1.7" fill="#cba6f7"/>

  <!-- Background Twinkling Stars -->
  <circle class="s2" cx="310" cy="30" r="1.3" fill="#cba6f7"/>
  <circle class="s4" cx="385" cy="135" r="1.4" fill="#f5c2e7"/>
  <circle class="s3" cx="515" cy="28" r="1.4" fill="#89b4fa"/>
  <circle class="s1" cx="575" cy="142" r="1.3" fill="#cba6f7"/>
  <circle class="s2" cx="445" cy="22" r="1.2" fill="#cdd6f4"/>
  <circle class="s4" cx="275" cy="75" r="1.1" fill="#cdd6f4"/>
  <circle class="s1" cx="620" cy="105" r="1.2" fill="#f5c2e7"/>
  <circle class="s3" cx="145" cy="30" r="1.2" fill="#89b4fa"/>
  <circle class="s2" cx="760" cy="32" r="1.2" fill="#cdd6f4"/>

  <!-- Title -->
  <text class="grad-text" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="url(#textGrad)">DurchEins</text>
</svg>
