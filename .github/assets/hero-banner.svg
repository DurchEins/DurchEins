<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" fill="none">
  <style>
    .s1 { animation: twinkle 2.4s infinite ease-in-out; }
    .s2 { animation: twinkle 3.3s infinite ease-in-out 0.6s; }
    .s3 { animation: twinkle 2.8s infinite ease-in-out 1.2s; }
    .s4 { animation: twinkle 3.8s infinite ease-in-out 1.8s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }
    .grad-text {
      animation: hue 8s infinite alternate ease-in-out;
    }
    @keyframes hue {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="169" rx="12" fill="url(#bg)" stroke="#313244" stroke-width="1"/>
  <!-- Constellation Lines -->
  <line x1="70" y1="35" x2="135" y2="75" stroke="#cba6f7" stroke-width="0.6" opacity="0.25"/>
  <line x1="135" y1="75" x2="195" y2="48" stroke="#89b4fa" stroke-width="0.6" opacity="0.25"/>
  <line x1="135" y1="75" x2="170" y2="130" stroke="#f5c2e7" stroke-width="0.6" opacity="0.25"/>
  <line x1="680" y1="42" x2="735" y2="88" stroke="#89b4fa" stroke-width="0.6" opacity="0.25"/>
  <line x1="735" y1="88" x2="815" y2="55" stroke="#cba6f7" stroke-width="0.6" opacity="0.25"/>
  <line x1="735" y1="88" x2="775" y2="138" stroke="#f5c2e7" stroke-width="0.6" opacity="0.25"/>
  <!-- Twinkling Starfield (24 Stars) -->
  <circle class="s1" cx="70" cy="35" r="2" fill="#cba6f7"/>
  <circle class="s2" cx="135" cy="75" r="1.5" fill="#cdd6f4"/>
  <circle class="s3" cx="195" cy="48" r="2.2" fill="#89b4fa"/>
  <circle class="s4" cx="170" cy="130" r="1.8" fill="#f5c2e7"/>
  <circle class="s2" cx="55" cy="115" r="1.4" fill="#89b4fa"/>
  <circle class="s1" cx="250" cy="28" r="1.6" fill="#f5c2e7"/>
  <circle class="s3" cx="285" cy="138" r="1.3" fill="#cba6f7"/>
  <circle class="s4" cx="110" cy="145" r="1.5" fill="#cdd6f4"/>
  <circle class="s1" cx="235" cy="95" r="1.2" fill="#89b4fa"/>
  <circle class="s2" cx="340" cy="42" r="1.4" fill="#cba6f7"/>
  <circle class="s4" cx="385" cy="128" r="1.5" fill="#f5c2e7"/>
  <circle class="s3" cx="515" cy="30" r="1.5" fill="#89b4fa"/>
  <circle class="s1" cx="560" cy="142" r="1.4" fill="#cba6f7"/>
  <circle class="s2" cx="620" cy="52" r="1.6" fill="#f5c2e7"/>
  <circle class="s4" cx="655" cy="125" r="1.2" fill="#cdd6f4"/>
  <circle class="s1" cx="680" cy="42" r="2" fill="#89b4fa"/>
  <circle class="s3" cx="735" cy="88" r="1.5" fill="#cdd6f4"/>
  <circle class="s2" cx="815" cy="55" r="2.2" fill="#cba6f7"/>
  <circle class="s4" cx="775" cy="138" r="1.8" fill="#f5c2e7"/>
  <circle class="s1" cx="850" cy="110" r="1.5" fill="#89b4fa"/>
  <circle class="s3" cx="845" cy="30" r="1.3" fill="#cdd6f4"/>
  <circle class="s2" cx="725" cy="25" r="1.4" fill="#f5c2e7"/>
  <circle class="s4" cx="695" cy="148" r="1.6" fill="#cba6f7"/>
  <circle class="s1" cx="445" cy="22" r="1.2" fill="#cdd6f4"/>
  <!-- Title -->
  <text class="grad-text" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="url(#textGrad)">DurchEins</text>
</svg>
